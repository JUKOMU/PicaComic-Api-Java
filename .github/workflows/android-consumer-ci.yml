name: android-consumer-ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  prepublish-build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure isolated Gradle home
        run: echo "GRADLE_USER_HOME=${RUNNER_TEMP}/picacomic-gradle-home" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Run pre-publish isolated D8/R8 smoke
        run: ./tools/android-consumer.sh --prepublish :app:assembleDebug :app:lintDebug :app:assembleRelease
      - name: Upload pre-publish APKs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-prepublish-apks
          path: smoke/android-consumer/app/build/outputs/apk/

  quick-instrumentation:
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    runs-on: ubuntu-latest
    steps:
      - name: Configure isolated Gradle home
        run: echo "GRADLE_USER_HOME=${RUNNER_TEMP}/picacomic-gradle-home" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 emulator'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Create API ${{ matrix.api-level }} emulator
        timeout-minutes: 25
        run: |
          set -euo pipefail
          avd_name="pica-api-${{ matrix.api-level }}"
          emulator_log="${RUNNER_TEMP}/emulator.log"
          emulator_pid=""
          emulator_serial=""

          print_emulator_diagnostics() {
            echo '--- adb devices ---'
            timeout 10s adb devices || true
            echo '--- emulator process ---'
            if [ -n "$emulator_pid" ]; then
              ps -p "$emulator_pid" -o pid=,stat=,cmd= || true
            fi
            echo '--- emulator.log ---'
            if [ -f "$emulator_log" ]; then
              cat "$emulator_log"
            else
              echo '(emulator.log not created)'
            fi
          }

          cleanup_emulator() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              print_emulator_diagnostics
            fi
            if [ -n "$emulator_pid" ] && kill -0 "$emulator_pid" 2>/dev/null; then
              kill "$emulator_pid" || true
            fi
            exit "$status"
          }
          trap cleanup_emulator EXIT

          timeout 10m sdkmanager --install "system-images;android-${{ matrix.api-level }};google_apis;x86_64"
          export ANDROID_AVD_HOME="${RUNNER_TEMP}/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | timeout 2m avdmanager create avd --force --name "$avd_name" \
            --package "system-images;android-${{ matrix.api-level }};google_apis;x86_64" --device pixel_2
          "${ANDROID_HOME}/emulator/emulator" -list-avds | grep -qx "$avd_name" || {
            echo "::error::AVD not visible to emulator"; ls -la "$ANDROID_AVD_HOME" || true; exit 1; }
          timeout 30s adb start-server
          nohup "${ANDROID_HOME}/emulator/emulator" -avd "$avd_name" -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -no-metrics -gpu swiftshader_indirect \
            >"$emulator_log" 2>&1 &
          emulator_pid=$!

          for attempt in $(seq 1 150); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "emulator process $emulator_pid exited before ADB became ready"
              exit 1
            fi
            if emulator_serial="$(timeout 10s adb devices 2>/dev/null | awk '$1 ~ /^emulator-/ && $2 == "device" && !found { print $1; found=1 }')"; then
              if [ -n "$emulator_serial" ]; then break; fi
            fi
            sleep 2
          done
          test -n "$emulator_serial"

          for attempt in $(seq 1 150); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "emulator process $emulator_pid exited before boot completed"
              exit 1
            fi
            booted="$(timeout 10s adb -s "$emulator_serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = "1" ]; then break; fi
            sleep 2
          done
          test "$(timeout 10s adb -s "$emulator_serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1"
          timeout 30s adb -s "$emulator_serial" shell input keyevent 82 || true
      - name: Run API ${{ matrix.api-level }} instrumentation smoke
        run: ./tools/android-consumer.sh --prepublish :app:connectedReleaseAndroidTest
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-api-${{ matrix.api-level }}-reports
          path: |
            ${{ runner.temp }}/emulator.log
            smoke/android-consumer/app/build/reports/
            smoke/android-consumer/app/build/outputs/androidTest-results/
