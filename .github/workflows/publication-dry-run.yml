name: publication-dry-run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or commit to qualify
        required: true
        default: master
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    if: github.repository == 'JUKOMU/PicaComic-Api-Java'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Check out the requested immutable source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Import the protected signing key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          key_file="$(mktemp)"
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" >"$key_file"
          gpg --batch --import "$key_file"
          rm -f "$key_file"
      - name: Build and inspect a signed bundle without publishing
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          settings_file="$(mktemp)"
          trap 'rm -f "$settings_file"' EXIT
          printf '%s\n' \
            '<settings><servers><server><id>central</id><username>dry-run</username><password>dry-run</password></server></servers></settings>' \
            >"$settings_file"
          mvn -B -ntp -s "$settings_file" -P release-signing -Dcentral.autoPublish=false \
            -DskipPublishing=true clean deploy
          test "$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" = '0.1.0-rc.1'
          mkdir -p release-manifest
          cp pom.xml release-manifest/picacomic-api-java.pom
          cp picacomic-api/pom.xml release-manifest/picacomic-api.pom
          cp picacomic-core/pom.xml release-manifest/picacomic-core.pom
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"
          printf '{
            "repository": "%s",
            "ref": "%s",
            "commit": "%s",
            "version": "0.1.0-rc.1",
            "coordinates": [
              "io.github.jukomu:picacomic-api-java:0.1.0-rc.1",
              "io.github.jukomu:picacomic-api:0.1.0-rc.1",
              "io.github.jukomu:picacomic-core:0.1.0-rc.1"
            ],
            "pgpFingerprint": "%s",
            "workflow": "%s/%s/actions/runs/%s"
          }
          ' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" \
            "$fingerprint" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > release-manifest/release-manifest.json
          find . -maxdepth 4 -type f \
            \( -name '*.jar' -o -name '*.pom' -o -name '*.asc' -o -name 'central-bundle.zip' \) \
            -not -path './.git/*' -print0 \
            | sort -z | xargs -0 sha256sum > release-manifest/sha256sums.txt
          find . -maxdepth 4 -type f \
            \( -name '*.jar' -o -name '*.pom' -o -name '*.asc' -o -name 'central-bundle.zip' \) \
            -not -path './.git/*' -print0 \
            | sort -z | xargs -0 sha512sum > release-manifest/sha512sums.txt
          git rev-parse HEAD > release-manifest/commit.txt
      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publication-dry-run
          path: release-manifest/
